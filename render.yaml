services:
  - type: web
    name: pitchiq
    runtime: python
    plan: free
    # Models are committed under backend/models/saved/, so only train if missing.
    buildCommand: pip install -r requirements.txt && python scripts/ensure_models.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      # Optional integrations (CRICKET_API_KEY, ODDS_API_KEY, SUPABASE_URL,
      # SUPABASE_KEY, RESEND_API_KEY) are added in the Render dashboard so the
      # blueprint deploys with no input. See README.md. Never commit values.
