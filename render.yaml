services:
  - type: web
    name: pitchiq
    runtime: python
    plan: free
    # Models are committed under backend/models/saved/, so only train if missing.
    buildCommand: pip install -r requirements.txt && python scripts/ensure_models.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      # Optional integrations — set in the Render dashboard, never commit values.
      - key: CRICKET_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
